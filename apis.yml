name: Chui
description: >-
  Chui, now operating as Trueface (part of BigBear.ai after the Pangiam
  acquisition), is a facial recognition and computer vision company. Originally
  launched as "Chui," the world's first faceprint API for access and identity,
  the technology is delivered today as a licensed developer SDK with C++,
  Python, Android, and iOS bindings, plus a Dockerized on-premises REST API
  (Trueface On-Prem / PTOP) for 1:1 and 1:N face matching, spoof and liveness
  detection, object detection, and identity verification. Deployment options
  span on-device, self-hosted Docker, and AWS. The technology has been evaluated
  in NIST FRVT and DHS/CBP testing and is applied across fintech, education,
  security, healthcare, retail, hospitality, and government. Surfaced as a
  500 Global portfolio company and profiled by the API Evangelist network.
